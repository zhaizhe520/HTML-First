<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title></title>
		<style>
			.slideTab {
				width: 100%;
				height: 1000px;
				background-color: pink;
			}
			
			.slideTab {
				width: 100%;
				height: 950px;
				background-color: skyblue;
			}
			
			.slideshow-container {
				position: relative;
				width: 100%;
				max-width: 1200px;
				margin-left:280px;
				padding: 20px;
			}
			
			.slides {
				position: relative;
				height: 600px;
				border-radius: 10px;
				overflow: hidden;
				box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
			}
			
			.slide {
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				opacity: 0;
				transition: opacity 0.8s ease;
			}
			
			.slide.active {
				opacity: 1;
				z-index: 1;
			}
			
			.slide img {
				width: 100%;
				height: 100%;
				object-fit: cover;
			}
			
			.slide-caption {
				position: absolute;
				bottom: 0;
				left: 0;
				width: 100%;
				padding: 20px;
				background: rgba(0, 0, 0, 0.7);
				color: rgb(205, 205, 31);
				font-size: 22px;
				text-align: center;
			}
			
			/* 控制按钮 */
			.slide-control {
				position: absolute;
				top: 50%;
				transform: translateY(-50%);
				background: rgba(0, 0, 0, 0.5);
				color: #d4af37;
				border: none;
				font-size: 36px;
				padding: 15px 20px;
				cursor: pointer;
				z-index: 10;
				transition: background 0.3s;
				border-radius: 50%;
				width: 60px;
				height: 60px;
				display: flex;
				align-items: center;
				justify-content: center;
			}
			
			.slide-control:hover {
				background: rgba(212, 175, 55, 0.3);
			}
			
			.slideshow-container .left {
				left: 20px;
			}
			
			.slideshow-container .right {
				right: 20px;
			}
			
			/* 定时器控制 */
			.timer-controls {
				display: flex;
				justify-content: center;
				gap: 15px;
				margin-top: 20px;
			}
			
			.timer-controls button {
				background: rgba(212, 175, 55, 0.1);
				border: 1px solid #5c3c0d;
				color: #f9f9d3;
				padding: 8px 15px;
				border-radius: 5px;
				cursor: pointer;
				transition: all 0.3s;
			}
			
			.timer-controls button:hover {
				background: rgba(212, 175, 55, 0.3);
				border-color: #d4af37;
			}
			
			.timer-status {
				color: #d4af37;
				align-self: center;
			}
			
			/* 指示器 */
			.slide-indicators {
				display: flex;
				justify-content: center;
				gap: 10px;
				margin-top: 15px;
			}
			
			.slideshow-container .indicator {
				width: 15px;
				height: 15px;
				border-radius: 50%;
				background: #5c3c0d;
				cursor: pointer;
				transition: background 0.3s;
			}
			
			.slideshow-container .indicator.active {
				background: #d4af37;
				transform: scale(1.2);
			}
			
		</style>
	</head>
	<body>
		<section class="slideTab">
			<section class="slideshow-container">
				<div class="slides">
					<div class="slide active">
						 <img src="HBuilderX/素材/111.jpg" alt="">
					</div>
					<div class="slide">
						<img src="HBuilderX/素材/盾勇.jpg" alt="">
					</div>
					<div class="slide">
						<img src="HBuilderX/素材/2222.jpeg" alt="">
					</div>
					<div class="slide">
						<img src="HBuilderX/素材/charlotte.jpg" alt="">
					</div>
				</div>
		
				<!-- 控制按钮 -->
				<button class="slide-control left" id="leftBtn">❮</button>
				<button class="slide-control right" id="rightBtn">❯</button>
		
				<!-- 定时器控制 -->
				<div class="timer-controls">
					
					<span class="timer-status"></span>
				</div>
		
				<!-- 指示器 -->
				<div class="slide-indicators">
					<span class="indicator active" data-index="0"></span>
					<span class="indicator" data-index="1"></span>
					<span class="indicator" data-index="2"></span>
					<span class="indicator" data-index="3"></span>
				</div>
			</section>
		
		
		
		<script>
			document.addEventListener('DOMContentLoaded', function () {
				const slides = document.querySelectorAll('.slide');
				const indicators = document.querySelectorAll('.indicator');
				const leftBtn = document.getElementById('leftBtn');
				const rightBtn = document.getElementById('rightBtn');
				const startTimerBtn = document.getElementById('startTimer');
				const stopTimerBtn = document.getElementById('stopTimer');
				const timerStatus = document.querySelector('.timer-status');
			
				let currentIndex = 0;
				let slideInterval;
				const slideDelay = 2000; // 5秒切换一次
			
				// 显示指定索引的幻灯片
				function showSlide(index) {
					// 隐藏所有幻灯片
					slides.forEach(slide => slide.classList.remove('active'));
					indicators.forEach(ind => ind.classList.remove('active'));
			
					// 确保索引在有效范围内
					if (index < 0) {
						currentIndex = slides.length - 1;
					} else if (index >= slides.length) {
						currentIndex = 0;
					} else {
						currentIndex = index;
					}
			
					// 显示当前幻灯片
					slides[currentIndex].classList.add('active');
					indicators[currentIndex].classList.add('active');
				}
			
				// 下一张幻灯片
				function nextSlide() {
					showSlide(currentIndex + 1);
				}
			
				// 上一张幻灯片
				function prevSlide() {
					showSlide(currentIndex - 1);
				}
			
				// 开始自动播放
				function startTimer() {
					if (slideInterval) clearInterval(slideInterval);
					slideInterval = setInterval(nextSlide, slideDelay);
					timerStatus.textContent = '';
	0			}
			
				// 停止自动播放
				function stopTimer() {
					clearInterval(slideInterval);
					slideInterval = null;
					timerStatus.textContent = '';
				}
			
				// 事件监听
				leftBtn.addEventListener('click', () => {
					stopTimer();
					prevSlide();
				});
			
				rightBtn.addEventListener('click', () => {
					stopTimer();
					nextSlide();
				});
			
				startTimerBtn.addEventListener('click', startTimer);
				stopTimerBtn.addEventListener('click', stopTimer);
			
				// 点击指示器切换幻灯片
				indicators.forEach(indicator => {
					indicator.addEventListener('click', () => {
						stopTimer();
						showSlide(parseInt(indicator.dataset.index));
					});
				});
			
				// 初始显示第一张幻灯片
				showSlide(0);
			});
			
			
		</script>
	</body>
</html>
